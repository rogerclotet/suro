name: Detect path changes
description: Shared dorny/paths-filter rules for the web, backend and wear areas
outputs:
  web:
    description: Whether web-affecting paths changed
    value: ${{ steps.filter.outputs.web }}
  backend:
    description: Whether backend-affecting paths changed
    value: ${{ steps.filter.outputs.backend }}
  wear:
    description: Whether Wear OS app paths changed
    value: ${{ steps.filter.outputs.wear }}
runs:
  using: composite
  steps:
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          web:
            - 'apps/web/**'
            - 'packages/backend/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - 'biome.json'
            - 'Dockerfile'
            - '.dockerignore'
            - 'compose.yaml'
            - '.github/workflows/**'
            - '.github/actions/**'
          backend:
            - 'packages/backend/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - '.github/workflows/**'
            - '.github/actions/**'
          wear:
            - 'apps/wear/**'
            # Color.kt is generated from the design tokens, so a palette change
            # has to rebuild the watch even when apps/wear itself is untouched.
            - 'packages/design-tokens/**'
            - '.github/workflows/**'
            - '.github/actions/**'
