name: Detect path changes
description: Shared dorny/paths-filter rules for web, backend and App Store screenshot areas
inputs:
  base:
    description: Commit to diff against outside pull requests (defaults to the push's previous commit)
    required: false
    default: ""
outputs:
  web:
    description: Whether web-affecting paths changed
    value: ${{ steps.filter.outputs.web }}
  backend:
    description: Whether backend-affecting paths changed
    value: ${{ steps.filter.outputs.backend }}
  apple_screenshots:
    description: Whether the committed App Store screenshots changed
    value: ${{ steps.filter.outputs.apple_screenshots }}
runs:
  using: composite
  steps:
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        base: ${{ inputs.base }}
        filters: |
          web:
            # Keep in sync with the on.push.paths trigger in deploy-web.yml.
            - 'packages/design-tokens/**'
            - 'apps/web/**'
            - 'packages/backend/**'
            - 'packages/domain/**'
            - 'packages/error-reporting/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - 'biome.json'
            - 'Dockerfile'
            - '.dockerignore'
            - 'compose.yaml'
          apple_screenshots:
            - 'apps/mobile/store/apple/screenshots/**'
          backend:
            - 'packages/backend/**'
            - 'packages/domain/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
