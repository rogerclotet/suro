name: Detect path changes
description: Shared dorny/paths-filter rules for web, backend and store-listing areas
outputs:
  web:
    description: Whether web-affecting paths changed
    value: ${{ steps.filter.outputs.web }}
  backend:
    description: Whether backend-affecting paths changed
    value: ${{ steps.filter.outputs.backend }}
  play_metadata:
    description: Whether the Play listing (text, images, screenshots) changed
    value: ${{ steps.filter.outputs.play_metadata }}
  apple_screenshots:
    description: Whether the committed App Store screenshots changed
    value: ${{ steps.filter.outputs.apple_screenshots }}
runs:
  using: composite
  steps:
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          web:
            - 'packages/design-tokens/**'
            - 'apps/web/**'
            - 'packages/backend/**'
            - 'packages/domain/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - 'biome.json'
            - 'Dockerfile'
            - '.dockerignore'
            - 'compose.yaml'
          play_metadata:
            # Listing text + images only. Patterns are OR-ed, so the release
            # notes under <locale>/changelogs/ are excluded by listing what the
            # `metadata` lane actually uploads — they ride with the binary.
            - 'apps/mobile/store/play/metadata/android/*/*.txt'
            - 'apps/mobile/store/play/metadata/android/*/images/**'
          apple_screenshots:
            - 'apps/mobile/store/apple/screenshots/**'
          backend:
            - 'packages/backend/**'
            - 'packages/domain/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'

