name: Setup Node and pnpm
description: Install pnpm, Node.js, and workspace dependencies with a frozen lockfile
inputs:
  node-version:
    description: Node.js version
    required: false
    default: "25.1"
  install-filter:
    description: Optional pnpm filter suffix (e.g. web... or mobile...)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - shell: bash
      env:
        INSTALL_FILTER: ${{ inputs.install-filter }}
      run: |
        if [ -n "$INSTALL_FILTER" ]; then
          pnpm install --frozen-lockfile --filter "$INSTALL_FILTER"
        else
          pnpm install --frozen-lockfile
        fi
