# Deploy an ephemeral web preview for a pull request.
#
# Previews deploy independently of CI quality checks — a red lint/typecheck
# run does not block preview deploy. Add a workflow_run gate here if that changes.
#
# Easiest triggers (no branch or PR number needed):
#   - Add the "deploy-preview" label to the PR
#   - Comment "/deploy-preview" on the PR
#   - Push new commits while the label is on the PR (auto-redeploy)
#
# Fallback: Actions → "Preview deploy" → provide PR number (branch selection is
# ignored; the workflow always builds the PR merge ref). Or from a git checkout:
#   ./scripts/trigger-preview-deploy.sh
#
# The preview builds the PR's code and runs it on the deploy host with the
# preview secrets, so only branches of this repository deploy, and only the
# repo's owner, members and collaborators can trigger one by comment.
#
# Preview URL: https://mr-<pr>.suro.clotet.dev

name: Preview deploy

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number (prefer the label or /deploy-preview comment instead)
        required: true
        type: number
  pull_request:
    types: [labeled, synchronize]
    branches: [main]
  issue_comment:
    types: [created]

permissions:
  contents: read
  packages: write
  pull-requests: write

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
  PREVIEW_DOMAIN: suro.clotet.dev

jobs:
  preview:
    # Decided here rather than in a script job, so pushes to unlabeled PRs and
    # unrelated comments skip without a runner and never join (and cancel) the
    # concurrency group below. `env` isn't available in a job `if`, hence the
    # literal label and command.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'deploy-preview') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'deploy-preview')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/deploy-preview') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    concurrency:
      group: preview-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
      # Auto-redeploys on push only comment when something needs attention.
      NOTIFY: ${{ github.event.action == 'synchronize' && 'on-failure' || 'always' }}
    steps:
      - name: Refuse pull requests from forks
        id: same_repo
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            if (pr.head.repo?.full_name !== repository) {
              core.setFailed(
                `PR #${pr.number} comes from ${pr.head.repo?.full_name ?? 'a deleted fork'}; previews only build branches of ${repository}.`,
              );
            }

      - uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/merge
          persist-credentials: false
      - uses: ./.github/actions/detect-path-changes
        id: changes

      - if: steps.changes.outputs.web == 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.changes.outputs.web == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.changes.outputs.web == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}:mr-${{ env.PR_NUMBER }}
          build-args: |
            SKIP_ENV_VALIDATION=1
            NEXT_PUBLIC_CONVEX_URL=${{ secrets.NEXT_PUBLIC_CONVEX_URL_PREVIEW }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}

      - name: Deploy preview environment
        id: deploy
        if: steps.changes.outputs.web == 'true'
        env:
          CI_MERGE_REQUEST_IID: ${{ env.PR_NUMBER }}
          CI_REGISTRY: ghcr.io
          CI_REGISTRY_USER: ${{ github.repository_owner }}
          CI_REGISTRY_PASSWORD: ${{ secrets.GHCR_PULL_TOKEN }}
          CI_REGISTRY_IMAGE: ${{ env.REGISTRY_IMAGE }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_IP: ${{ secrets.SSH_IP }}
          SSH_PROJECT_DIRECTORY: ${{ secrets.SSH_PROJECT_DIRECTORY }}
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends sshpass openssh-client
          chmod +x apps/web/scripts/deploy-preview.sh
          apps/web/scripts/deploy-preview.sh

      # A superseded run stays quiet; the run that replaced it reports.
      - name: Comment the result on the PR
        if: ${{ !cancelled() && steps.same_repo.outcome == 'success' }}
        uses: actions/github-script@v9
        env:
          WEB_CHANGED: ${{ steps.changes.outputs.web }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const prNumber = process.env.PR_NUMBER;
            const previewUrl = `https://mr-${prNumber}.${process.env.PREVIEW_DOMAIN}`;
            const runUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;
            const hasWebChanges = process.env.WEB_CHANGED === 'true';
            const failed = process.env.JOB_STATUS === 'failure';

            let body;
            if (process.env.DEPLOY_OUTCOME === 'success') {
              body = `Preview deployed: ${previewUrl}`;
            } else if (failed) {
              body = `Preview deploy failed for #${prNumber}. See the [workflow run](${runUrl}).`;
            } else if (!hasWebChanges) {
              body = `Preview deploy skipped for #${prNumber}: no web-affecting changes in this PR.`;
            } else {
              body = `Preview deploy skipped for #${prNumber}.`;
            }

            if (process.env.NOTIFY === 'on-failure' && !failed && hasWebChanges) {
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(prNumber),
              body,
            });
