# CI checks for Suro: lint/typecheck/test on every PR and main push, a Next.js
# compile-check on web-affecting PRs, and GitHub release tagging when the root
# version bumps on main.
#
# Production deploys live in sibling workflows:
#   deploy-web.yml      — web image + Convex (path-gated)
#   mobile-release.yml  — EAS builds + store submit (release-gated)
#   play-listing.yml    — Play Store listing text/images
#   preview-deploy.yml / preview-teardown.yml — ephemeral PR previews
#   mobile-submit.yml   — manual store re-submit
#
# Triggers: pull requests to main, pushes to main. Feature-branch pushes alone
# do not run CI — open a PR to get checks.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect_path_changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.changes.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/detect-path-changes
        id: changes

  quality:
    uses: ./.github/workflows/reusable-quality-checks.yml

  web_pr_build:
    needs: detect_path_changes
    if: github.event_name == 'pull_request' && needs.detect_path_changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          install-filter: web...
      - name: Next.js production build (compile check)
        env:
          SKIP_ENV_VALIDATION: "1"
          NEXT_TELEMETRY_DISABLED: "1"
          POSTHOG_API_KEY: ""
          POSTHOG_ENV_ID: ""
        run: pnpm run build

  release_tag:
    needs: quality
    if: github.event_name == 'push' && needs.quality.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag and publish a GitHub release when the version changed
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: node scripts/publish-release.mjs
