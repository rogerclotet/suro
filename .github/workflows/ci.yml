# CI checks for Suro: lint/typecheck/test on every PR and main push, plus a
# Next.js compile-check on web-affecting PRs.
#
# Production deploys live in sibling workflows:
#   deploy-web.yml      — web image + Convex (path-gated)
#   release.yml         — GitHub release + EAS builds + store submit (version bump)
#   play-listing.yml    — Play Store listing text/images
#   preview-deploy.yml / preview-teardown.yml — ephemeral PR previews
#   mobile-submit.yml   — manual store re-submit
#
# Triggers: pull requests to main, pushes to main. Feature-branch pushes alone
# do not run CI — open a PR to get checks.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The ruleset requires this check by its name, `quality / repo_quality_checks`.
  quality:
    uses: ./.github/workflows/reusable-quality-checks.yml

  web_pr_build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/detect-path-changes
        id: changes
      # PRs that don't touch the web app pass without building.
      - if: steps.changes.outputs.web == 'true'
        uses: ./.github/actions/setup-node-pnpm
        with:
          install-filter: web...
      - name: Next.js production build (compile check)
        if: steps.changes.outputs.web == 'true'
        env:
          SKIP_ENV_VALIDATION: "1"
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: ""
        run: pnpm run build
