# Tear down an ephemeral preview environment.
#
# Auto-runs when:
#   - The "deploy-preview" label is removed from a PR
#   - A PR with the label is merged to main
# Manual fallback: Actions → "Preview teardown" → PR number.

name: Preview teardown

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: number
  pull_request:
    types: [closed, unlabeled]
    branches: [main]

permissions:
  contents: read

jobs:
  stop_preview:
    # Other label removals and PRs closed without a preview skip without a
    # runner. `env` isn't available in a job `if`, hence the literal label.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'deploy-preview') ||
      (github.event.action == 'closed' && github.event.pull_request.merged &&
       contains(github.event.pull_request.labels.*.name, 'deploy-preview'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tear down preview environment
        env:
          CI_MERGE_REQUEST_IID: ${{ github.event.pull_request.number || inputs.pr_number }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_IP: ${{ secrets.SSH_IP }}
          SSH_PROJECT_DIRECTORY: ${{ secrets.SSH_PROJECT_DIRECTORY }}
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends sshpass openssh-client
          chmod +x apps/web/scripts/teardown-preview.sh
          apps/web/scripts/teardown-preview.sh
