# Manual store re-submission for a commit that already built on main. The
# Release workflow waits for EAS builds and submits automatically; use this
# only to re-submit a specific commit (e.g. after a transient store error).
#
# commit_sha — the full SHA of the push that produced the EAS build artifacts
# (suro-<platform>-<sha>, kept 14 days).
# ios_skip_upload — the binary already reached App Store Connect and only the
# metadata push / review submission needs retrying.
# checkout_sha — optional ref for release notes / fastlane metadata (defaults to
# commit_sha). Use current main when re-submitting an older binary after a
# metadata-only fix (e.g. Play release notes length).

name: Mobile submit

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA on main (from the Release run that triggered EAS builds)
        required: true
        type: string
      checkout_sha:
        description: Ref to check out for release notes (defaults to commit_sha; use main after a metadata fix)
        required: false
        type: string
        default: ""
      platform:
        description: Platform to submit
        required: true
        type: choice
        options:
          - android
          - ios
          - both
      push_screenshots:
        description: Re-upload the committed App Store screenshots (iOS, slow)
        required: false
        type: boolean
        default: false
      ios_skip_upload:
        description: "iOS: binary is already on App Store Connect — only push metadata + submit for review"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  EXPO_APPLE_TEAM_ID: ${{ vars.EXPO_APPLE_TEAM_ID != '' && vars.EXPO_APPLE_TEAM_ID || '2XUF926TS6' }}
  CHECKOUT_SHA: ${{ inputs.checkout_sha != '' && inputs.checkout_sha || inputs.commit_sha }}

jobs:
  find_build_artifacts:
    runs-on: ubuntu-latest
    outputs:
      android_run_id: ${{ steps.find.outputs.android_run_id }}
      ios_run_id: ${{ steps.find.outputs.ios_run_id }}
    steps:
      # A build job uploads its artifact only after the EAS build succeeded, so
      # the artifact alone identifies a usable run, whichever workflow made it.
      - uses: actions/github-script@v9
        id: find
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          PLATFORM: ${{ inputs.platform }}
        with:
          script: |
            const sha = process.env.COMMIT_SHA;
            const platforms =
              process.env.PLATFORM === 'both' ? ['android', 'ios'] : [process.env.PLATFORM];

            for (const platform of platforms) {
              const name = `suro-${platform}-${sha}`;
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name,
              });
              const artifact = data.artifacts.find((entry) => !entry.expired);
              if (!artifact) {
                core.setFailed(`No unexpired ${name} artifact; is ${sha} the full SHA of a release push from the last 14 days?`);
                return;
              }
              core.info(`Using ${name} from run ${artifact.workflow_run.id}`);
              core.setOutput(`${platform}_run_id`, String(artifact.workflow_run.id));
            }

  submit_android:
    needs: find_build_artifacts
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_SHA }}
      - uses: actions/download-artifact@v8
        with:
          name: suro-android-${{ inputs.commit_sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.find_build_artifacts.outputs.android_run_id }}
          path: apps/mobile/build
      - uses: ./.github/actions/mobile-submit-android
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
          play-service-account-json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          redownload-if-missing: "true"

  submit_ios:
    needs: find_build_artifacts
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    # Includes waiting for Apple to process the build before submitting it.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_SHA }}
      - uses: actions/download-artifact@v8
        with:
          name: suro-ios-${{ inputs.commit_sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.find_build_artifacts.outputs.ios_run_id }}
          path: apps/mobile/build
      - uses: ./.github/actions/mobile-submit-ios
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
          expo-apple-team-id: ${{ env.EXPO_APPLE_TEAM_ID }}
          app-store-connect-api-key-key: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          app-store-connect-api-key-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          app-store-connect-api-key-issuer-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          push-screenshots: ${{ inputs.push_screenshots }}
          skip-upload: ${{ inputs.ios_skip_upload }}
          redownload-if-missing: "true"
