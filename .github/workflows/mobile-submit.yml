# Manual store re-submission for a commit that already built on main. The
# Mobile release workflow waits for EAS builds and submits automatically; use
# this only to re-submit a specific commit (e.g. after a transient store error).
#
# commit_sha — the push that produced the EAS build artifact (Mobile release
# run lookup).
# ios_skip_upload — the binary already reached App Store Connect and only the
# metadata push / review submission needs retrying.
# checkout_sha — optional ref for release notes / fastlane metadata (defaults to
# commit_sha). Use current main when re-submitting an older binary after a
# metadata-only fix (e.g. Play release notes length).

name: Mobile submit

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit SHA on main (from the Mobile release run that triggered EAS builds)
        required: true
        type: string
      checkout_sha:
        description: Ref to check out for release notes (defaults to commit_sha; use main after a metadata fix)
        required: false
        type: string
        default: ""
      platform:
        description: Platform to submit
        required: true
        type: choice
        options:
          - android
          - ios
          - both
      push_screenshots:
        description: Re-upload the committed App Store screenshots (iOS, slow)
        required: false
        type: boolean
        default: false
      ios_skip_upload:
        description: "iOS: binary is already on App Store Connect — only push metadata + submit for review"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  EXPO_APPLE_TEAM_ID: ${{ vars.EXPO_APPLE_TEAM_ID != '' && vars.EXPO_APPLE_TEAM_ID || '2XUF926TS6' }}
  CHECKOUT_SHA: ${{ inputs.checkout_sha != '' && inputs.checkout_sha || inputs.commit_sha }}

jobs:
  find_ci_run:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - uses: actions/github-script@v9
        id: find
        with:
          script: |
            const sha = '${{ inputs.commit_sha }}';
            const platform = '${{ inputs.platform }}';
            const buildJobNames =
              platform === 'ios'
                ? ['mobile_release / mobile_eas_build_ios']
                : platform === 'android'
                  ? ['mobile_release / mobile_eas_build_android']
                  : [
                      'mobile_release / mobile_eas_build_android',
                      'mobile_release / mobile_eas_build_ios',
                    ];

            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'mobile-release.yml',
              head_sha: sha,
              event: 'push',
              per_page: 5,
            });

            async function runHasSuccessfulBuild(runId) {
              const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
              });
              return buildJobNames.every((jobName) =>
                jobs.jobs.some(
                  (job) => job.name === jobName && job.conclusion === 'success',
                ),
              );
            }

            for (const run of data.workflow_runs) {
              if (run.conclusion === 'success') {
                core.setOutput('run_id', String(run.id));
                return;
              }
              if (run.conclusion === 'failure' && (await runHasSuccessfulBuild(run.id))) {
                core.info(
                  `Using CI run ${run.id} for ${sha}: overall failure, but required build job(s) succeeded`,
                );
                core.setOutput('run_id', String(run.id));
                return;
              }
            }

            core.setFailed(
              `No Mobile release run with a successful store build found for commit ${sha}`,
            );

  submit_android:
    needs: find_ci_run
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_SHA }}
      - uses: actions/download-artifact@v8
        with:
          name: suro-android-${{ inputs.commit_sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.find_ci_run.outputs.run_id }}
          path: apps/mobile/build
      - uses: ./.github/actions/mobile-submit-android
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
          play-service-account-json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          redownload-if-missing: "true"

  submit_ios:
    needs: find_ci_run
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    # Includes waiting for Apple to process the build before submitting it.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_SHA }}
      - uses: actions/download-artifact@v8
        with:
          name: suro-ios-${{ inputs.commit_sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.find_ci_run.outputs.run_id }}
          path: apps/mobile/build
      - uses: ./.github/actions/mobile-submit-ios
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
          expo-apple-team-id: ${{ env.EXPO_APPLE_TEAM_ID }}
          app-store-connect-api-key-key: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          app-store-connect-api-key-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          app-store-connect-api-key-issuer-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          push-screenshots: ${{ inputs.push_screenshots }}
          skip-upload: ${{ inputs.ios_skip_upload }}
          redownload-if-missing: "true"
