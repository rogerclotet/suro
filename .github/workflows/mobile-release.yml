# Mobile release on pushes to main when the native release gate passes
# (version bump + matching CHANGELOG entry + native file changes), or via
# Actions → Mobile release → Run workflow (skips the gate; main only).
#
# EAS builds both platforms, then submits to Play (100% production) and App
# Store (upload + metadata + submit for review). Apple screenshot re-upload
# runs when store/apple/screenshots changed in the same push, or when the
# manual run opts in.
#
# Play listing text/images ship separately via play-listing.yml; both share the
# play-console concurrency group so fastlane never overlaps.
# For re-submitting an already-built commit, use mobile-submit.yml instead.

name: Mobile release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      push_screenshots:
        description: Re-upload the committed App Store screenshots (slow)
        required: false
        type: boolean
        default: false

concurrency:
  group: mobile-release-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile_release_gate:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.gate.outputs.should_build }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Mobile release is only allowed on main (got ${{ github.ref }})." >&2
          exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether to trigger EAS native builds
        id: gate
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "reason=Manual workflow_dispatch (gate skipped) on ${{ github.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node apps/mobile/scripts/should-build-native.mjs

  detect_path_changes:
    needs: mobile_release_gate
    if: needs.mobile_release_gate.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      apple_screenshots: ${{ steps.changes.outputs.apple_screenshots }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/detect-path-changes
        id: changes

  quality:
    needs: mobile_release_gate
    if: needs.mobile_release_gate.outputs.should_build == 'true'
    uses: ./.github/workflows/reusable-quality-checks.yml

  mobile_release:
    needs: [mobile_release_gate, detect_path_changes, quality]
    if: |
      needs.mobile_release_gate.outputs.should_build == 'true' &&
      needs.quality.result == 'success'
    uses: ./.github/workflows/reusable-mobile-release.yml
    with:
      commit_sha: ${{ github.sha }}
      # Manual runs use the checkbox; pushes use path detection. Quote booleans
      # as strings so a false checkbox does not fall through the || to path output.
      push_screenshots: ${{ github.event_name == 'workflow_dispatch' && (inputs.push_screenshots && 'true' || 'false') || needs.detect_path_changes.outputs.apple_screenshots }}
    secrets: inherit
